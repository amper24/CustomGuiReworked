# ============================================================
#  CustomGuiReworked configuration
# ============================================================

# Язык интерфейса: en / ru (файлы в папке lang/)
language: en

storage:
  # Период автоматического сохранения "грязных" данных (тики).
  # Закрытие интерфейса, выход игрока и остановка сервера
  # сохраняют данные всегда — автосейв лишь подстраховка.
  # 0 = выключить (не рекомендуется).
  autosave-ticks: 600
  # Максимум кэшируемых в памяти хранилищ. Чистые записи
  # могут быть выгружены при превышении (данные останутся на диске).
  max-cached-views: 10000
  # Пауза коалесинга записи (мс): серия кликов схлопывается
  # в одну файловую запись. Закрытие GUI и выход игрока пишут
  # немедленно (coalesce не ждётся). 0 — запись без задержки.
  coalesce-ms: 1000

commands:
  # Выполнять привязанные к слотам команды от имени OP
  # (старое поведение плагина — временно setOp).
  # Рекомендуется держать false и выдавать игрокам нужные права.
  execute-as-op: false

# Интеграции со скриптовыми плагинами
# (устанавливаются рядом в plugins/ — плагин сам определит их наличие)
integration:
  # Skript: события on cgui open/close/click, условия, выражения, действия.
  skript: true
  # Denizen: события on cgui open/close/click, теги <cgui.*>.
  denizen: true
