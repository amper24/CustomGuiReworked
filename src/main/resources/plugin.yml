name: CustomGuiReworked
version: '${version}'
main: dev.moonaticks.customGuiReworked.CustomGuiReworked
api-version: '26.1'
description: Skeleton-based custom GUI framework: visual editor, pluggable storage, ItemsAdder & CraftEngine block support, library-ready API.
author: moonaticks
website: https://github.com/amper24/CustomGuiReworked

softdepend: [NBTAPI, ItemsAdder, CraftEngine]

commands:
  gui:
    description: Manage custom GUIs
    usage: /gui [create|edit|open|delete|list|command|reload]

permissions:
  cgui.create:
    description: Allow /gui create
    default: op
  cgui.edit:
    description: Allow /gui edit
    default: op
  cgui.open:
    description: Allow /gui open
    default: op
  cgui.delete:
    description: Allow /gui delete
    default: op
  cgui.reload:
    description: Allow /gui reload
    default: op
  cgui.command:
    description: Allow /gui command (bind/unbind slot commands)
    default: op
