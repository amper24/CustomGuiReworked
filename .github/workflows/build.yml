name: Build

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle_build
        continue-on-error: true
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish failure details
        if: steps.gradle_build.outputs.gradle_exit != '0'
        run: |
          set -x
          # Хвост лога -> step summary (виден в check run через API)
          {
            echo "### Gradle build failed"
            echo '<details><summary>build log tail</summary>'
            echo
            echo '```'
            tail -c 24000 build.log
            echo
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          # И одной error-аннотацией (переводы строк кодируются как %0A)
          python3 - <<'PY'
          import os, urllib.parse
          log = open('build.log', encoding='utf-8', errors='replace').read()[-9000:]
          msg = urllib.parse.quote(log, safe='')[:30000]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ERRMSG={msg}\n")
          PY
          echo "::error title=Gradle build failed::%0A${ERRMSG}"
          exit 1
