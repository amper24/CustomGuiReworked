name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag format (x.y.z)
        if: "!github.ref_name.matches('^\\d+\\.\\d+\\.\\d+$')"
        run: |
          echo "Tag '${{ github.ref_name }}' is not x.y.z — no release."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: bash ./gradlew build --no-daemon --console=plain

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          files: build/libs/${{ github.event.repository.name }}-${{ github.ref_name }}*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
