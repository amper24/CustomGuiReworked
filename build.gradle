plugins {
    id 'java'
    id "xyz.jpenilla.run-paper" version "3.1.0"
}

group = 'dev.moonaticks'
version = '2.2.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "CodeMC"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "momirealms"
        url = "https://repo.momirealms.net/releases/"
    }
    maven {
        name = "matteodev"
        url = "https://maven.devs.beer/"
    }
    maven {
        name = "skriptlang-repo"
        url = "https://repo.skriptlang.org/releases"
    }
    maven {
        name = "citizens-repo"
        url = "https://maven.citizensnpcs.co/repo"
    }
}

dependencies {
    // Paper API 26.2 (Java 25)
    compileOnly("io.papermc.paper:paper-api:26.2.build.123-stable")

    // NBTAPI — эталонный формат предметов (опционально в рантайме)
    compileOnly("de.tr7zw:item-nbt-api-plugin:2.16.0")

    // ItemsAdder — опциональная интеграция кастомных блоков
    compileOnly("dev.lone:api-itemsadder:4.0.10")

    // CraftEngine — опциональная интеграция кастомных блоков
    compileOnly("net.momirealms:craft-engine-core:26.9")
    compileOnly("net.momirealms:craft-engine-bukkit:26.9")

    // Skript — опциональная скриптовая интеграция
    // (транзитивные зависимости отключаем: Skript сам требует
    //  repo.destroystokyo/CodeMC и т.п., нам нужен только его API)
    compileOnly("com.github.SkriptLang:Skript:2.15.2") {
        isTransitive = false
    }

    // Denizen — опциональная скриптовая интеграция
    // (в официальном репозитории Citizens есть только снапшоты 1.3.x)
    compileOnly("com.denizenscript:denizen:1.3.3-SNAPSHOT") {
        isTransitive = false
    }

    // Тесты
    testImplementation(platform("org.junit:junit-bom:6.0.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events("passed", "skipped", "failed")
    }
}

tasks {
    runServer {
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
