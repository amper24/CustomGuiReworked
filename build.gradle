plugins {
    id 'java'
    id "xyz.jpenilla.run-paper" version "3.1.0"
}

group = 'dev.moonaticks'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "CodeMC"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "momirealms"
        url = "https://repo.momirealms.net/releases/"
    }
    maven {
        name = "matteodev"
        url = "https://maven.devs.beer/"
    }
}

dependencies {
    // Paper API 26.2 (Java 25)
    compileOnly("io.papermc.paper:paper-api:26.2.build.123-stable")

    // NBTAPI — эталонный формат предметов (опционально в рантайме)
    compileOnly("de.tr7zw:item-nbt-api-plugin:2.16.0")

    // ItemsAdder — опциональная интеграция кастомных блоков
    compileOnly("dev.lone:api-itemsadder:4.0.10")

    // CraftEngine — опциональная интеграция кастомных блоков
    compileOnly("net.momirealms:craft-engine-core:26.9")
    compileOnly("net.momirealms:craft-engine-bukkit:26.9")
}

tasks {
    runServer {
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
