plugins {
    id 'java'
    id 'maven-publish'
    id "xyz.jpenilla.run-paper" version "3.1.0"
}

group = 'dev.moonaticks'
version = '2.2.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "CodeMC"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "momirealms"
        url = "https://repo.momirealms.net/releases/"
    }
    maven {
        name = "matteodev"
        url = "https://maven.devs.beer/"
    }
    maven {
        name = "skriptlang-repo"
        url = "https://repo.skriptlang.org/releases"
    }
    maven {
        name = "citizens-repo"
        url = "https://maven.citizensnpcs.co/repo"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    // Paper API 26.2 (Java 25)
    compileOnly("io.papermc.paper:paper-api:26.2.build.123-stable")

    // NBTAPI — эталонный формат предметов (опционально в рантайме)
    compileOnly("de.tr7zw:item-nbt-api-plugin:2.16.0")

    // ItemsAdder — опциональная интеграция кастомных блоков
    compileOnly("dev.lone:api-itemsadder:4.0.10")

    // CraftEngine — опциональная интеграция кастомных блоков
    compileOnly("net.momirealms:craft-engine-core:26.9")
    compileOnly("net.momirealms:craft-engine-bukkit:26.9")

    // Skript — опциональная скриптовая интеграция
    // (транзитивные зависимости отключаем: Skript сам требует
    //  repo.destroystokyo/CodeMC и т.п., нам нужен только его API)
    compileOnly("com.github.SkriptLang:Skript:2.15.2") {
        isTransitive = false
    }

    // Denizen — опциональная скриптовая интеграция
    // (в официальном репозитории Citizens есть только снапшоты 1.3.x)
    compileOnly("com.denizenscript:denizen:1.3.3-SNAPSHOT") {
        isTransitive = false
    }

    // Тесты
    testImplementation(platform("org.junit:junit-bom:6.0.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    // Mockito — мок Bukkit-типов без запущенного сервера
    // (ItemStack в paper-api требует реестры сервера)
    testImplementation("org.mockito:mockito-core:5.23.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // compileOnly не попадает в testRuntimeClasspath, а тесты исполняют
    // код, ссылающийся на Bukkit/Paper API (моки, без запущенного сервера)
    testRuntimeOnly("io.papermc.paper:paper-api:26.2.build.123-stable")
}

tasks.test {
    useJUnitPlatform()
    // Mockito inline-mock-maker динамически подгружает byte-buddy-агент
    jvmArgs("-XX:+EnableDynamicAgentLoading")
    testLogging {
        events("passed", "skipped", "failed")
    }
}

tasks {
    runServer {
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// ================= публикация (JitPack / Maven Local) =================
// Для потребителей API:
//   repositories { maven { url 'https://jitpack.io' } }
//   dependencies { compileOnly 'com.github.amper24:CustomGuiReworked:2.2.0' }
// JitPack при первом обращении собирает этот Gradle-проект
// (publishToMavenLocal) и раздаёт артефакт по тегу.
java {
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // groupId/artifactId оставлены дефолтными (dev.moonaticks /
            // CustomGuiReworked для mavenLocal); JitPack раздаёт проект
            // по координате com.github.amper24:CustomGuiReworked:<тег>.
            from components.java
            pom {
                name = 'CustomGuiReworked'
                description = 'Skeleton-based custom GUI framework for Paper: visual editor, ' +
                        'persistent block/personal/global/team storage, ItemsAdder & CraftEngine ' +
                        'block support, Skript & Denizen integration and a library-ready API.'
                url = 'https://github.com/amper24/CustomGuiReworked'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'moonaticks'
                        name = 'moonaticks'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/amper24/CustomGuiReworked.git'
                    developerConnection = 'scm:git:ssh://github.com/amper24/CustomGuiReworked.git'
                    url = 'https://github.com/amper24/CustomGuiReworked'
                }
                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/amper24/CustomGuiReworked/issues'
                }
            }
        }
    }
}
